                    <div class="bg-white rounded-[2.5rem] p-8 md:p-12 shadow-sm border border-stone-200 mb-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-8 text-stone-100/50 pointer-events-none select-none">
                            <span class="text-7xl font-black">Q${q.id}</span>
                        </div>
                        <p class="text-lg md:text-xl text-stone-800 leading-relaxed font-bold mb-10 whitespace-pre-wrap relative z-10">${q.text}</p>
                        
                        <div class="grid grid-cols-1 gap-4 relative z-10">
                            ${q.options.map((opt, i) => {
                                const label = ["ア", "イ", "ウ", "エ"][i];
                                const isSelected = state.userAnswers[q.id] === label;
                                const isCorrect = q.answer === label;
                                
                                let style = "border-stone-200 hover:border-emerald-400 hover:bg-emerald-50/50";
                                if (state.mode === 'study' && state.showFeedback) {
                                    if (isCorrect) style = "border-emerald-500 bg-emerald-50 text-emerald-700 ring-1 ring-emerald-500";
                                    else if (isSelected) style = "border-rose-500 bg-rose-50 text-rose-700 ring-1 ring-rose-500";
                                    else style = "border-stone-100 opacity-50 grayscale";
                                } else if (isSelected) {
                                    style = "border-emerald-600 bg-emerald-600 text-white shadow-lg";
                                }

                                return `
                                    <button onclick="selectAnswer(${i})" 
                                            ${state.mode === 'study' && state.showFeedback ? 'disabled' : ''}
                                            class="flex items-center w-full p-5 rounded-2xl border-2 transition-all duration-200 text-left font-bold group ${style}">
                                        <span class="w-8 h-8 rounded-xl flex items-center justify-center font-black mr-4 text-sm bg-stone-100 text-stone-500 ${isSelected && state.mode === 'exam' ? 'bg-white text-emerald-600' : ''}">${label}</span>
                                        <span class="flex-1 text-sm md:text-base">${opt.includes(':') ? opt.split(': ')[1] : opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="flex justify-between items-center">
                        <button onclick="prevQuestion()" ${state.currentIdx === 0 ? 'disabled' : ''} class="px-6 py-3 rounded-2xl border border-stone-200 font-bold text-stone-600 disabled:opacity-30 hover:bg-white transition-all">戻る</button>
                        <button onclick="nextQuestion()" ${state.mode === 'study' && !state.showFeedback ? 'disabled' : ''} class="px-10 py-3 bg-stone-900 text-white rounded-2xl font-black shadow-lg disabled:opacity-30">
                            ${state.currentIdx === filtered.length - 1 ? '結果を表示' : '次へ'}
                        </button>
                    </div>

                    ${state.mode === 'study' && state.showFeedback ? `
                        <div class="mt-8 fade-in">
                            <div class="p-8 rounded-[2rem] border-2 ${state.userAnswers[q.id] === q.answer ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                                <h4 class="font-black text-lg mb-2">${state.userAnswers[q.id] === q.answer ? '正解です！' : '不正解です'}</h4>
                                <p class="text-sm font-bold opacity-80">正解は 「${q.answer}」 です。${getDomainExplanation(q.id)}</p>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // --- 結果画面 ---
        function getResultsHTML() {
            const h = state.history[0];
            const scorePercent = Math.round(h.score / h.total * 100);

            return `
                <div class="fade-in text-center">
                    <div class="mb-10">
                        <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner text-emerald-600">
                            <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                        </div>
                        <h1 class="text-4xl font-black text-stone-800 mb-2">試験終了</h1>
                        <p class="text-stone-400 font-bold tracking-widest uppercase">Result Summary</p>
                    </div>

                    <div class="bg-white rounded-[3rem] p-10 md:p-14 shadow-2xl shadow-stone-200 border border-stone-200 mb-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                            <div>
                                <div class="inline-block p-10 bg-stone-50 rounded-full border-[12px] border-emerald-100 mb-4 shadow-inner">
                                    <span class="text-7xl font-black text-emerald-600 leading-none">${scorePercent}<span class="text-2xl ml-1">%</span></span>
                                </div>
                                <p class="font-black text-stone-400 text-sm tracking-widest uppercase">総合スコア</p>
                            </div>
                            <div class="text-left space-y-6">
                                <h3 class="font-black text-xl text-stone-800 border-b-4 border-emerald-100 pb-2 inline-block">分野別の正解状況</h3>
                                <div class="space-y-4">
                                    ${h.categoryScores.map(cat => `
                                        <div>
                                            <div class="flex justify-between text-xs font-black text-stone-500 mb-1">
                                                <span>${cat.name}</span>
                                                <span class="text-emerald-600 font-bold">${cat.score} / ${cat.total}</span>
                                            </div>
                                            <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden shadow-inner">
                                                <div class="h-full bg-emerald-500 rounded-full transition-all duration-1000" style="width: ${cat.score/cat.total*100}%"></div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="showHome()" class="px-10 py-5 bg-stone-900 text-white rounded-2xl font-black shadow-xl hover:bg-stone-800 transition-all">ホームに戻る</button>
                        <button onclick="startExam()" class="px-10 py-5 border-2 border-emerald-600 text-emerald-700 rounded-2xl font-black hover:bg-emerald-50 transition-all">もう一度挑戦</button>
                    </div>
                </div>
            `;
        }

        // --- ロジック ---
        function getFilteredQuestions() {
            if (state.category === 'すべて') return EXAM_DATA;
            return EXAM_DATA.filter(q => q.category === state.category);
        }

        function startStudy(category) {
            state.category = category;
            state.mode = 'study';
            state.view = 'quiz';
            state.currentIdx = 0;
            state.userAnswers = {};
            state.showFeedback = false;
            render();
        }

        function startExam() {
            state.category = 'すべて';
            state.mode = 'exam';
            state.view = 'exam';
            state.currentIdx = 0;
            state.userAnswers = {};
            state.timeLeft = 7200;
            startTimer();
            render();
        }

        function selectAnswer(idx) {
            const labels = ["ア", "イ", "ウ", "エ"];
            const currentFiltered = getFilteredQuestions();
            const q = currentFiltered[state.currentIdx];
            
            state.userAnswers[q.id] = labels[idx];
            
            if (state.mode === 'study') {
                state.showFeedback = true;
            }
            render();
        }

        function nextQuestion() {
            const filtered = getFilteredQuestions();
            if (state.currentIdx < filtered.length - 1) {
                state.currentIdx++;
                state.showFeedback = false;
                render();
                window.scrollTo(0, 0);
            } else {
                finishExam();
            }
        }

        function prevQuestion() {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                state.showFeedback = false;
                render();
                window.scrollTo(0, 0);
            }
        }

        function finishExam() {
            stopTimer();
            const results = {
                date: new Date().toLocaleString('ja-JP'),
                score: EXAM_DATA.filter(q => state.userAnswers[q.id] === q.answer).length,
                total: EXAM_DATA.length,
                categoryScores: ['ストラテジ系', 'マネジメント系', 'テクノロジ系'].map(cat => ({
                    name: cat,
                    score: EXAM_DATA.filter(q => q.category === cat && state.userAnswers[q.id] === q.answer).length,
                    total: EXAM_DATA.filter(q => q.category === cat).length
                }))
            };

            state.history = [results, ...state.history].slice(0, 5);
            localStorage.setItem('it_passport_history', JSON.stringify(state.history));
            state.view = 'results';
            render();
            window.scrollTo(0, 0);
        }

        // --- タイマー関連 ---
        function startTimer() {
            stopTimer();
            state.timerId = setInterval(() => {
                state.timeLeft--;
                updateTimerUI();
                if (state.timeLeft <= 0) {
                    stopTimer();
                    showModal("時間切れです。採点に移行します。");
                    finishExam();
                }
            }, 1000);
        }

        function stopTimer() {
            if (state.timerId) clearInterval(state.timerId);
        }

        function updateTimerUI() {
            const minutes = Math.floor(state.timeLeft / 60);
            const seconds = state.timeLeft % 60;
            const text = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            document.getElementById('timer-text').innerText = text;
        }

        // --- ユーティリティ ---
        function showModal(text) {
            document.getElementById('modal-content').innerHTML = `<p class="text-lg font-bold">${text}</p>`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function getDomainExplanation(id) {
            if (id <= 34) return "この問題はストラテジ系です。経営戦略やシステム戦略、法務に関する基礎知識が問われます。";
            if (id <= 54) return "この問題はマネジメント系です。開発管理やサービス管理、監査に関する知識が重要です。";
            return "この問題はテクノロジ系です。ITの基礎技術、ネットワーク、セキュリティの深い理解が必要です。";
        }

        // 初期ロード
        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
